<title>SemaceNews nº 9</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  /* Jornal folheável: uma folha por vez, vira para a esquerda como papel; capa, internas e expediente */
  :root {
    --mesa: #e4ebe5;        /* fundo atrás do jornal */
    --papel: #fdfdf9;
    --tinta: #18241c;
    --cinza: #5d6a61;
    --linha: #d3dbd4;
    --verde: #00582e;       /* verde da logomarca */
    --verde-claro: #eaf3e4;
    --azul: #007cc3;        /* azul da logomarca */
    --lima: #84c225;        /* verde-claro da logomarca */
    --display: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", Arial, sans-serif;
    --sombra: 0 18px 40px -18px rgba(20, 40, 28, .45);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mesa: #0f1612; --papel: #1a221d; --tinta: #e7ece8; --cinza: #a6b2aa; --linha: #34413a; --verde: #7fcf8f; --verde-claro: #1d3326; --azul: #5db6ec; --lima: #9fd64a; --sombra: 0 18px 40px -18px rgba(0,0,0,.8); color-scheme: dark } }
  :root[data-theme="dark"] { --mesa: #0f1612; --papel: #1a221d; --tinta: #e7ece8; --cinza: #a6b2aa; --linha: #34413a; --verde: #7fcf8f; --verde-claro: #1d3326; --azul: #5db6ec; --lima: #9fd64a; --sombra: 0 18px 40px -18px rgba(0,0,0,.8); color-scheme: dark }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--mesa); color: var(--tinta); font: 16px/1.5 var(--display); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
  a { color: inherit; }
  .palco { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }

  /* ---------- livro ---------- */
  .livro { display: grid; position: relative; perspective: 2200px; }
  /* Só a folha aberta dá a altura do livro; as outras ficam por baixo, do mesmo tamanho. */
  .folha:not(.atual) { position: absolute; inset: 0; }
  .folha { grid-area: 1 / 1; position: relative; min-width: 0; background: var(--papel); box-shadow: var(--sombra); transform-origin: left center; transform-style: preserve-3d; backface-visibility: hidden; transition: transform .8s cubic-bezier(.45,.05,.2,1), opacity .8s; padding: 28px 32px 22px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; }
  .folha::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.07), transparent 7%); }
  .folha.virada { transform: rotateY(-100deg); opacity: 0; pointer-events: none; }
  .folha.depois { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { .folha { transition: none; } }

  /* ---------- cabeçalho ---------- */
  .cabeca { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; border-bottom: 4px solid var(--verde); box-shadow: 0 3px 0 var(--lima); padding-bottom: 12px; margin-bottom: 3px; }
  .logo { width: 104px; height: 92px; display: grid; place-items: center; text-align: center; color: var(--verde); font: 600 12px/1.15 var(--sans); text-transform: uppercase; }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 4px; padding: 4px; }
  .titulo-jornal { text-align: center; min-width: 0; }
  .titulo-jornal h1 { font: 800 clamp(30px, 5.6vw, 44px)/1 var(--display); letter-spacing: -1px; }
  .titulo-jornal h1 span { color: var(--azul); }
  .titulo-jornal p { font: 600 12px/1.2 var(--sans); letter-spacing: 2px; text-transform: uppercase; color: var(--cinza); margin-top: 4px; }
  .edicao { text-align: right; font: 600 14px/1.3 var(--sans); color: var(--cinza); font-variant-numeric: tabular-nums; }
  .edicao b { display: block; font-size: 22px; color: var(--verde); }
  .faixa { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--azul); color: var(--papel); font: 600 13px/1.2 var(--sans); letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px; margin-top: 10px; }
  .cabeca-interna { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 3px solid var(--verde); padding-bottom: 8px; font: 600 14px/1.2 var(--sans); color: var(--cinza); }
  .cabeca-interna strong { font: 800 26px/1 var(--display); color: var(--tinta); letter-spacing: -.5px; }
  .marca { display: inline-flex; align-items: center; }
  .marca img { margin-right: 10px; width: 40px; height: 35px; object-fit: contain; background: #fff; border-radius: 3px; padding: 2px; }
  .cabeca-interna strong span { color: var(--azul); }

  /* ---------- conteúdo ---------- */
  .corpo { flex: 1 0 auto; display: grid; align-content: start; gap: 18px; padding-top: 18px; }
  .resumo { font-style: italic; font-size: 17px; color: var(--cinza); border-left: 3px solid var(--lima); padding-left: 12px; }
  .editoria { font: 700 13px/1.2 var(--sans); letter-spacing: 1.5px; text-transform: uppercase; color: var(--verde); }
  .destaque { display: grid; gap: 10px; background: var(--verde-claro); padding: 22px 22px 18px; }
  .destaque h2 { font: 800 clamp(28px, 5.4vw, 42px)/1.08 var(--display); letter-spacing: -.6px; text-wrap: balance; }
  .destaque p { font-size: 18px; max-width: 62ch; }
  .ler { font: 700 14px/1 var(--sans); letter-spacing: .6px; text-transform: uppercase; color: var(--verde); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .ler:hover { text-decoration: underline; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; }
  .grade.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .nota { display: grid; gap: 6px; align-content: start; border-top: 1px solid var(--linha); padding-top: 12px; min-width: 0; }
  .nota h3 { font: 600 19px/1.22 var(--display); text-wrap: balance; }
  .nota h3 a { text-decoration: none; }
  .nota h3 a:hover { text-decoration: underline; text-decoration-color: var(--verde); }
  .nota p { font-size: 15px; color: var(--tinta); }
  .interna .nota:first-child { grid-column: 1 / -1; }
  .interna .nota:first-child h3 { font-size: 28px; }
  .interna .nota:first-child p { font-size: 17px; }
  .meta { font: 500 13px/1.2 var(--sans); color: var(--cinza); display: flex; justify-content: space-between; gap: 8px; }
  .nota-foto { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--verde-claro); margin-bottom: 4px; }
  .destaque.com-foto { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 20px; }
  .destaque-foto { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .destaque-texto { display: grid; gap: 10px; min-width: 0; }
  .info { display: grid; gap: 14px; }
  .info article { display: grid; gap: 10px; border-top: 3px solid var(--verde); padding-top: 12px; }
  .info h2 { font: 700 26px/1.15 var(--display); }
  .info h3 { font: 700 13px/1.2 var(--sans); letter-spacing: 1px; text-transform: uppercase; color: var(--verde); margin-top: 6px; }
  .info p, .info li { font-size: 16px; line-height: 1.5; }
  .info ul { display: grid; gap: 6px; padding-left: 20px; }
  .info li b { color: var(--tinta); }
  .info .botoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .info .botoes a { display: inline-block; background: var(--verde); color: var(--papel); font: 700 14px/1 var(--sans); padding: 10px 14px; text-decoration: none; }
  .doe { display: grid; gap: 12px; }
  .doe-intro { font-size: 15px; color: var(--cinza); }
  .ato { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; border-top: 1px solid var(--linha); padding-top: 12px; }
  .ato-data { font: 700 13px/1.25 var(--sans); color: var(--verde); text-transform: uppercase; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .ato h3 { font: 600 18px/1.25 var(--display); }
  .ato h3 a { text-decoration: none; }
  .ato h3 a:hover { text-decoration: underline; text-decoration-color: var(--verde); }
  .ato p { font-size: 15px; }
  .selo-doe { display: inline-block; background: var(--verde); color: var(--papel); font: 700 12px/1 var(--sans); letter-spacing: 1px; text-transform: uppercase; padding: 5px 8px; }
  .sumario { display: grid; gap: 8px; }
  .sumario li { list-style: none; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: baseline; border-bottom: 1px dotted var(--linha); padding-bottom: 6px; }
  .sumario li span { font: 700 13px/1 var(--sans); color: var(--verde); text-transform: uppercase; letter-spacing: 1px; }
  .sumario a { text-decoration: none; font-size: 16px; }
  .sumario a:hover { text-decoration: underline; }

  /* ---------- expediente ---------- */
  .expediente { display: grid; gap: 14px; font-size: 16px; }
  .expediente h2 { font: 800 30px/1.1 var(--display); }
  .fontes-lista { columns: 2; column-gap: 22px; font: 500 15px/1.6 var(--sans); }
  .flora { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; align-items: center; background: var(--verde-claro); padding: 16px; margin-top: 6px; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--azul); background: #fff; display: grid; place-items: center; overflow: hidden; color: var(--verde); font: 700 12px/1.1 var(--sans); text-align: center; text-transform: uppercase; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
  .flora p { font-size: 18px; }
  .flora strong { color: var(--verde); }

  /* ---------- rodapé de cada folha ---------- */
  .pe { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 8px; padding-right: 54px; display: flex; justify-content: space-between; gap: 12px; font: 500 12.5px/1.35 var(--sans); color: var(--cinza); }
  .pe .num { font-weight: 700; color: var(--verde); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .canto { position: absolute; right: 0; bottom: 0; width: 46px; height: 46px; background: linear-gradient(225deg, var(--mesa) 50%, var(--linha) 50%); transition: width .25s, height .25s; }
  .folha:hover .canto { width: 62px; height: 62px; }

  /* ---------- controles ---------- */
  .controles { display: flex; justify-content: center; align-items: center; gap: 14px; font: 600 15px/1 var(--sans); }
  .barra { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font: 600 14px/1 var(--sans); }
  .partilha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .partilha span { color: var(--cinza); }
  .botao { font: 700 14px/1 var(--sans); color: var(--verde); background: var(--papel); border: 1.5px solid var(--verde); padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .botao:hover { background: var(--verde-claro); }
  .botao:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  .botao svg { width: 16px; height: 16px; fill: currentColor; }
  .aviso-copia { font: 500 13px/1.3 var(--sans); color: var(--verde); min-height: 1.3em; text-align: right; }
  .controles button { font: 700 15px/1 var(--sans); letter-spacing: .5px; color: var(--papel); background: var(--verde); border: 0; padding: 11px 18px; cursor: pointer; }
  .controles button:disabled { opacity: .35; cursor: default; }
  .controles button:focus-visible, a:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
  .pontos { display: flex; gap: 7px; }
  .pontos i { width: 9px; height: 9px; border-radius: 50%; background: var(--linha); }
  .pontos i.ativo { background: var(--azul); }
  .dica { text-align: center; font: 500 13px/1.3 var(--sans); color: var(--cinza); }

  @media (max-width: 620px) {
    .folha { padding: 20px 18px 16px; }
    .cabeca { grid-template-columns: 1fr auto; }
    .titulo-jornal { grid-column: 1 / -1; grid-row: 2; }
    .logo { width: 76px; height: 67px; }
    .grade, .grade.tres, .destaque.com-foto { grid-template-columns: 1fr; }
    .ato { grid-template-columns: 1fr; gap: 4px; }
    .fontes-lista { columns: 1; }
  }
</style>
</head>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dominio = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const temDoe = EDICAO.doe && EDICAO.doe.length > 0;
const infos = EDICAO.informativos || [];
const secoesInfo = [...new Set(infos.map((i) => i.secao))];
const total = 2 + secoesInfo.length + EDICAO.paginas.length + (temDoe ? 1 : 0);
const rodape = (n) => `<div class="pe"><span>SemaceNews é um projeto em parceria da Assessoria de Comunicação (Ascom) e da Diretoria de Tecnologia da Informação e Comunicação (Ditec) da Semace.</span><span class="num">Ed. ${EDICAO.numero} · p. ${n}/${total}</span></div><div class="canto"></div>`;
const logo = () => `<div class="logo">${EDICAO.logo ? `<img src="${EDICAO.logo}" alt="Semace">` : 'Logomarca<br>Semace'}</div>`;
const nota = (m) => `<article class="nota">${m.foto ? `<a href="${esc(m.link)}" target="_blank" rel="noopener" tabindex="-1"><img class="nota-foto" src="${m.foto}" alt=""></a>` : ''}<p class="editoria">${esc(m.editoria)}</p><h3><a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.titulo)}</a></h3><p>${esc(m.chamada)}</p><p class="meta"><span>${esc(m.fonte)}</span><a class="ler" href="${esc(m.link)}" target="_blank" rel="noopener">Ler ›</a></p></article>`;

function capa() {
  const m = EDICAO.manchete;
  const nI = secoesInfo.length;
  const dentro = EDICAO.paginas.flatMap((p, i) => p.materias.map((x) => ({ ...x, pag: i + 2 + nI })));
  const pagDoe = 2 + nI + EDICAO.paginas.length;
  const itensInfo = infos.map((x) => ({ titulo: `${x.secao}: ${x.titulo}`, pag: 2 + secoesInfo.indexOf(x.secao) }));
  return `<header class="cabeca">${logo()}<div class="titulo-jornal"><h1>Semace<span>News</span></h1><p>A Semace e o meio ambiente</p></div><div class="edicao">Edição<b>nº ${EDICAO.numero}</b></div></header>
  <div class="faixa"><span>${esc(EDICAO.data)}</span><span>Fortaleza, Ceará</span></div>
  <div class="corpo">
    ${EDICAO.resumo ? `<p class="resumo">${esc(EDICAO.resumo)}</p>` : ''}
    <article class="destaque${m.foto ? ' com-foto' : ''}">${m.foto ? `<img class="destaque-foto" src="${m.foto}" alt="">` : ''}<div class="destaque-texto"><p class="editoria">${esc(m.editoria)} · ${esc(m.fonte)}</p><h2><a href="${esc(m.link)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(m.titulo)}</a></h2><p>${esc(m.chamada)}</p><a class="ler" href="${esc(m.link)}" target="_blank" rel="noopener">Ler a matéria em ${esc(dominio(m.link))} ›</a></div></article>
    <div class="grade tres">${EDICAO.capa.map(nota).join('')}</div>
    ${dentro.length || temDoe || nI ? `<div><p class="editoria" style="margin-bottom:8px">Nesta edição</p><ul class="sumario">${itensInfo.map((x) => `<li><span>p. ${x.pag}</span><a href="#" data-pagina="${x.pag - 1}">${esc(x.titulo)}</a></li>`).join('')}${dentro.map((x) => `<li><span>p. ${x.pag}</span><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.titulo)}</a></li>`).join('')}${temDoe ? `<li><span>p. ${pagDoe}</span><a href="#" data-pagina="${pagDoe - 1}">Diário Oficial do Estado: ${EDICAO.doe.length} ${EDICAO.doe.length === 1 ? 'ato cita' : 'atos citam'} a Semace</a></li>` : ''}</ul></div>` : ''}
  </div>${rodape(1)}`;
}

function interna(p, n) {
  return `<header class="cabeca-interna"><strong class="marca">${EDICAO.logo ? `<img src="${EDICAO.logo}" alt="Semace">` : ''}Semace<span>News</span></strong><span>${esc(p.titulo)} · ${esc(EDICAO.data)}</span></header>
  <div class="corpo"><div class="grade interna">${p.materias.map(nota).join('')}</div></div>${rodape(n)}`;
}

function informativo(secao, n) {
  const bloco = (b) => b.h ? `<h3>${esc(b.h)}</h3>` : b.lista ? `<ul>${b.lista.map((it) => Array.isArray(it) ? `<li><b>${esc(it[0])}:</b> ${esc(it[1])}</li>` : `<li>${esc(it)}</li>`).join('')}</ul>` : `<p>${esc(b.p || '')}</p>`;
  return `<header class="cabeca-interna"><strong class="marca">${EDICAO.logo ? `<img src="${EDICAO.logo}" alt="Semace">` : ''}Semace<span>News</span></strong><span>${esc(secao)} · ${esc(EDICAO.data)}</span></header>
  <div class="corpo info">
    <p><span class="selo-doe">${esc(secao)}</span></p>
    ${infos.filter((i) => i.secao === secao).map((i) => `<article><h2>${esc(i.titulo)}</h2>${i.blocos.map(bloco).join('')}${i.links.length ? `<p class="botoes">${i.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.texto)}</a>`).join('')}</p>` : ''}</article>`).join('')}
  </div>${rodape(n)}`;
}

function diario(n) {
  return `<header class="cabeca-interna"><strong class="marca">${EDICAO.logo ? `<img src="${EDICAO.logo}" alt="Semace">` : ''}Semace<span>News</span></strong><span>Diário Oficial do Estado · ${esc(EDICAO.data)}</span></header>
  <div class="corpo doe">
    <p><span class="selo-doe">Diário Oficial do Estado do Ceará</span></p>
    <p class="doe-intro">Atos do Diário Oficial do dia útil anterior com menção explícita à Semace. Cada título abre o caderno na página do ato.</p>
    ${EDICAO.doe.map((a) => `<article class="ato"><p class="ato-data">${esc(a.dataCurta)}<br>Cad. ${esc(a.caderno)} · p. ${esc(a.pagina)}</p><div><h3><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.titulo)}</a></h3><p>${esc(a.resumo)}</p></div></article>`).join('')}
  </div>${rodape(n)}`;
}

function expediente() {
  return `<header class="cabeca-interna"><strong class="marca">${EDICAO.logo ? `<img src="${EDICAO.logo}" alt="Semace">` : ''}Semace<span>News</span></strong><span>Expediente · Edição nº ${EDICAO.numero}</span></header>
  <div class="corpo expediente">
    <h2>Sobre esta edição</h2>
    <p>O SemaceNews circula de segunda a sexta com notícias sobre a Semace e o meio ambiente. As matérias são selecionadas a partir de fontes públicas e cada título leva direto à publicação original. Confira a matéria original antes de citar.</p>
    <div><p class="editoria" style="margin-bottom:6px">Fontes lidas nesta edição</p><ul class="fontes-lista">${EDICAO.fontes.map((f) => `<li style="list-style:none">${esc(f)}</li>`).join('')}</ul></div>
    ${EDICAO.endereco ? `<p>Edições anteriores e a edição do dia em <a href="${esc(EDICAO.endereco)}" target="_blank" rel="noopener">${esc(EDICAO.endereco.replace(/^https?:\/\//, ''))}</a>.</p>` : ''}
    <p>Projeto em parceria da <strong>Assessoria de Comunicação (Ascom)</strong> e da <strong>Diretoria de Tecnologia da Informação e Comunicação (Ditec)</strong> da Semace.</p>
    <div class="flora"><div class="avatar">${EDICAO.flora ? `<img src="${EDICAO.flora}" alt="Agente Flora Comunica">` : 'Foto da<br>Flora'}</div><p>O SemaceNews é uma ação da agente <strong>Flora Comunica</strong>.</p></div>
  </div>${rodape(total)}`;
}

const livro = document.getElementById('livro');
const conteudos = [capa(), ...secoesInfo.map((sec, i) => informativo(sec, i + 2)), ...EDICAO.paginas.map((p, i) => interna(p, i + 2 + secoesInfo.length)), ...(temDoe ? [diario(2 + secoesInfo.length + EDICAO.paginas.length)] : []), expediente()];
livro.innerHTML = conteudos.map((c, i) => `<section class="folha" data-i="${i}" style="z-index:${100 - i}" aria-label="Página ${i + 1} de ${total}">${c}</section>`).join('');
const folhas = [...livro.querySelectorAll('.folha')];
const pontos = document.getElementById('pontos');
pontos.innerHTML = folhas.map(() => '<i></i>').join('');
let atual = 0;
try { atual = Math.min(Number(localStorage.getItem('semacenews-pagina-' + EDICAO.numero)) || 0, total - 1); } catch {}

function mostrar() {
  folhas.forEach((f, i) => {
    f.classList.toggle('virada', i < atual);
    f.classList.toggle('atual', i === atual);
    f.classList.toggle('depois', i > atual + 1);
    f.setAttribute('aria-hidden', i === atual ? 'false' : 'true');
    f.inert = i !== atual;
  });
  [...pontos.children].forEach((p, i) => p.classList.toggle('ativo', i === atual));
  document.getElementById('voltar').disabled = atual === 0;
  document.getElementById('avancar').disabled = atual === total - 1;
  try { localStorage.setItem('semacenews-pagina-' + EDICAO.numero, atual); } catch {}
}
const ir = (d) => {
  const n = Math.max(0, Math.min(total - 1, atual + d));
  if (n === atual) return;
  atual = n; mostrar();
  // A folha nova pode ser mais curta: volta para o topo dela.
  if (livro.getBoundingClientRect().top < 0) livro.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
};
document.getElementById('voltar').onclick = () => ir(-1);
document.getElementById('avancar').onclick = () => ir(1);
livro.addEventListener('click', (e) => {
  const salto = e.target.closest('[data-pagina]');
  if (salto) { e.preventDefault(); atual = Number(salto.dataset.pagina); mostrar(); return; }
  if (e.target.closest('a')) return;
  const r = livro.getBoundingClientRect();
  ir(e.clientX - r.left < r.width * 0.3 ? -1 : 1);
});
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') ir(1); if (e.key === 'ArrowLeft') ir(-1); });
let x0 = null;
livro.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
livro.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) ir(dx < 0 ? 1 : -1); x0 = null; });


// ---------- modo claro / escuro ----------
const raizDoc = document.documentElement;
const botaoTema = document.getElementById('tema');
const escuroAgora = () => raizDoc.dataset.theme ? raizDoc.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function rotularTema() { const e = escuroAgora(); botaoTema.textContent = e ? 'Modo claro' : 'Modo escuro'; botaoTema.setAttribute('aria-pressed', String(e)); }
try { const t = localStorage.getItem('semacenews-tema'); if (t === 'dark' || t === 'light') raizDoc.dataset.theme = t; } catch {}
botaoTema.onclick = () => {
  raizDoc.dataset.theme = escuroAgora() ? 'light' : 'dark';
  try { localStorage.setItem('semacenews-tema', raizDoc.dataset.theme); } catch {}
  rotularTema();
};
rotularTema();

// ---------- compartilhar ----------
// Link a compartilhar: o endereço público desta edição (GitHub Pages); aberto como arquivo, o do site.
function linkDaEdicao() {
  try {
    if (/^https?:/.test(location.href)) {
      const u = new URL(location.href); u.hash = ''; u.search = '';
      // Na página principal (sempre a edição mais recente), compartilha o endereço fixo desta edição.
      if (EDICAO.dia && /(^|\/)(index\.html)?$/.test(u.pathname)) u.pathname = u.pathname.replace(/index\.html$/, '') + `edicoes/${EDICAO.dia}.html`;
      return u.href;
    }
  } catch {}
  return EDICAO.endereco || '';
}
// Texto curto de propósito: e-mail (mailto) e WhatsApp cortam textos longos.
function textoParaCompartilhar() {
  const linhas = [`SemaceNews nº ${EDICAO.numero}, ${EDICAO.data}`, '', `Manchete: ${EDICAO.manchete.titulo}`];
  for (const x of infos) linhas.push(`• ${x.secao}: ${x.titulo}`);
  const outras = [...EDICAO.capa, ...EDICAO.paginas.flatMap((p) => p.materias)].slice(0, 5);
  for (const x of outras) linhas.push(`• ${x.titulo}`);
  if (EDICAO.doe && EDICAO.doe.length) linhas.push(`• Diário Oficial: ${EDICAO.doe.length} ${EDICAO.doe.length === 1 ? 'ato cita' : 'atos citam'} a Semace`);
  const link = linkDaEdicao();
  if (link) linhas.push('', `Leia a edição completa: ${link}`);
  linhas.push('', 'Projeto Ascom e Ditec da Semace. Uma ação da agente Flora Comunica.');
  return linhas.join('\n');
}
const textoPartilha = textoParaCompartilhar();
const assunto = `SemaceNews nº ${EDICAO.numero}, ${EDICAO.data}`;
document.getElementById('por-email').href = `mailto:?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(textoPartilha)}`;
document.getElementById('por-whatsapp').href = `https://wa.me/?text=${encodeURIComponent(textoPartilha)}`;
// O Google Chat não aceita texto pronto por link: copia o resumo e abre o Chat para colar.
document.getElementById('por-chat').onclick = async () => {
  const aviso = document.getElementById('aviso-copia');
  let copiou = false;
  try { await navigator.clipboard.writeText(textoPartilha); copiou = true; } catch {}
  aviso.textContent = copiou ? 'Resumo copiado. Cole na conversa do Google Chat (Ctrl+V).' : 'Não consegui copiar sozinho. Copie o resumo pelo WhatsApp ou e-mail.';
  window.open('https://chat.google.com/', '_blank', 'noopener');
};

mostrar();
</script>
